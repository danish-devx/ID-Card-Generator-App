<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Card Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main-container">


        <div class="form-container">

            <h2>Generate ID Card</h2>

            <div class="form-grid">

                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="name">
                </div>

                <div class="input-group">
                    <label>Father Name</label>
                    <input type="text" id="fatherName">
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>

                <div class="input-group">
                    <label>Phone</label>
                    <input type="text" id="phone" maxlength="11">
                </div>

                <div class="input-group">
                    <label>CNIC</label>
                    <input type="text" id="cnic" maxlength="13">
                </div>

                <div class="input-group">
                    <label>Course</label>
                    <select id="course">
                        <option>Select Course</option>
                        <option>Modern Web Development</option>
                        <option>Graphic Design</option>
                        <option>App Development</option>
                        <option>Digital Marketing</option>
                    </select>
                </div>

                <div class="input-group full">
                    <label>Address</label>
                    <input type="text" id="address">
                </div>

                <div class="input-group full">
                    <label>Upload Image</label>
                    <input type="file" id="image">
                </div>

            </div>

            <button id="generateBtn">Generate</button>

        </div>





        <div class="card-container">

            <div class="id-card" id="card">

                <div class="card-header">
                    <h3>Student ID Card</h3>
                </div>

                <div class="card-body">

                    <img id="previewImg" src="" alt="student picture">

                    <div class="card-info">
                        <p><strong>Name &nbsp;:</strong> <span id="cName"></span></p>
                        <p><strong>Father :</strong> <span id="cFather"></span></p>
                        <p><strong>Email &nbsp;:</strong> <span id="cEmail"></span></p>
                        <p><strong>Phone :</strong> <span id="cPhone"></span></p>
                        <p><strong>CNIC &nbsp;&nbsp;:</strong> <span id="cCnic"></span></p>
                        <p><strong>Course &nbsp;&nbsp;:</strong> <span id="cCourse"></span></p>
                        <p><strong>Address :</strong> <span id="cAddress"></span></p>
                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="app.js"></script>
</body>

</html>
